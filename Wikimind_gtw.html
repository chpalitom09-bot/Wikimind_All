<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>WikiMind GTW - ULTRA EDITION</title>
    <style>
        /* --- STYLE GLOBAL & UI --- */
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
        
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Rajdhani', sans-serif; user-select: none; }
        
        /* Containers */
        #game-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: none; }
        
        /* Main Menu */
        #main-menu { position: absolute; z-index: 100; inset: 0; background: radial-gradient(circle at center, #2a2a2a, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        h1 { font-size: 80px; margin: 0; color: #facc15; text-shadow: 0 0 20px #facc15; font-style: italic; }
        .menu-btn { background: #facc15; color: black; border: none; padding: 15px 40px; font-size: 24px; font-weight: bold; cursor: pointer; transform: skewX(-10deg); transition: 0.2s; margin-top: 20px; box-shadow: 0 0 10px #facc15; }
        .menu-btn:hover { background: white; transform: skewX(-10deg) scale(1.1); }
        .setting-row { margin: 10px; display: flex; align-items: center; gap: 10px; font-size: 20px; }
        input[type="color"] { border: none; width: 40px; height: 40px; cursor: pointer; }

        /* HUD */
        .hud-panel { pointer-events: auto; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 24px; height: 24px; }
        
        #wanted-level { position: absolute; top: 20px; right: 20px; display: flex; gap: 5px; }
        .star { font-size: 30px; color: #333; text-shadow: 0 0 5px black; }
        .star.active { color: red; animation: pulse 0.5s infinite alternate; }
        
        #health-hud { position: absolute; bottom: 30px; left: 30px; width: 300px; }
        .bar-cont { width: 100%; height: 20px; background: rgba(0,0,0,0.8); border: 2px solid #555; transform: skewX(-20deg); overflow: hidden; margin-bottom: 5px; }
        .bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
        .hp-fill { background: linear-gradient(90deg, #8b0000, #ff0000); }
        .arm-fill { background: linear-gradient(90deg, #004488, #0088ff); }
        
        #weapon-hud { position: absolute; bottom: 30px; right: 30px; text-align: right; color: white; }
        .ammo-count { font-size: 60px; font-weight: bold; color: #facc15; line-height: 1; }
        .wep-name { font-size: 20px; color: #aaa; text-transform: uppercase; }

        #interaction-txt { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #facc15; font-size: 20px; font-weight: bold; text-shadow: 0 2px 4px black; display: none; }

        /* Phone */
        #phone { position: absolute; bottom: -600px; right: 20px; width: 280px; height: 550px; background: #111; border: 4px solid #333; border-radius: 20px; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: auto; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        #phone.open { bottom: 20px; }
        .phone-header { background: #222; padding: 10px; color: white; text-align: center; font-size: 12px; }
        .phone-screen { flex: 1; background: url('https://img.freepik.com/free-vector/blue-geometric-background_53876-115049.jpg') center/cover; padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-auto-rows: 70px; gap: 10px; }
        .app-icon { background: rgba(0,0,0,0.7); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-size: 10px; cursor: pointer; transition: 0.1s; border: 1px solid rgba(255,255,255,0.2); }
        .app-icon:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .app-emoji { font-size: 24px; margin-bottom: 5px; }

        @keyframes pulse { from { opacity: 0.6; transform: scale(1); } to { opacity: 1; transform: scale(1.2); } }
        
        /* Debug Hitboxes Toggle */
        .debug-box { position: absolute; top: 0; left: 0; pointer-events: none; border: 1px solid lime; display: none; }
    </style>
</head>
<body>

    <!-- MENU PRINCIPAL -->
    <div id="main-menu">
        <h1>WIKIMIND <span style="color:white">GTW</span></h1>
        <p style="color:#aaa; letter-spacing: 5px;">GRAND THEFT WEB - CHAOS EDITION</p>
        
        <div class="setting-row">
            <span>Pseudo:</span>
            <input type="text" id="player-name" value="Joueur" style="padding:5px; border-radius:5px; border:none;">
        </div>
        <div class="setting-row">
            <span>Couleur Tenue:</span>
            <input type="color" id="skin-color" value="#0088ff">
        </div>
        <div class="setting-row">
            <label style="cursor:pointer;"><input type="checkbox" id="show-hitboxes"> Afficher Hitboxes (Debug)</label>
        </div>

        <button class="menu-btn" id="play-btn">REJOINDRE LA VILLE</button>
    </div>

    <!-- UI JEU -->
    <div id="ui-layer">
        <div id="wanted-level">
            <span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span>
        </div>

        <div id="crosshair">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="2" fill="white"/>
                <line x1="30" y1="50" x2="70" y2="50" stroke="white" stroke-width="2"/>
                <line x1="50" y1="30" x2="50" y2="70" stroke="white" stroke-width="2"/>
            </svg>
        </div>

        <div id="interaction-txt">[F] Monter</div>

        <div id="health-hud">
            <div class="bar-cont"><div class="bar-fill arm-fill" id="armor-bar" style="width: 0%;"></div></div>
            <div class="bar-cont"><div class="bar-fill hp-fill" id="hp-bar" style="width: 100%;"></div></div>
        </div>

        <div id="weapon-hud">
            <div class="ammo-count" id="ammo-ui">∞</div>
            <div class="wep-name" id="wep-ui">Mains Nues</div>
        </div>

        <!-- TÉLÉPHONE -->
        <div id="phone">
            <div class="phone-header">WikiPhone 15 Pro - 12:00</div>
            <div class="phone-screen">
                <div class="app-icon" onclick="callService('police')"><span class="app-emoji">👮</span>Police</div>
                <div class="app-icon" onclick="callService('medic')"><span class="app-emoji">🚑</span>SAMU</div>
                <div class="app-icon" onclick="callService('cheat')"><span class="app-emoji">🕶️</span>Lester</div>
                <div class="app-icon" onclick="callService('car')"><span class="app-emoji">🚗</span>Voiture</div>
            </div>
        </div>
    </div>

    <div id="game-container"></div>

    <!-- MODULES -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, onDisconnect, update, remove, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- CONFIG & CONSTANTES ---
        const CONFIG = {
            gravity: 20,
            walkSpeed: 10,
            runSpeed: 18,
            jumpForce: 10,
            showHitboxes: false
        };

        const WEAPONS = [
            { id: 0, name: 'Poings', type: 'melee', dmg: 10, rate: 500, range: 3, model: 'fist' },
            { id: 1, name: 'Pistolet', type: 'hitscan', dmg: 25, rate: 400, range: 50, ammo: Infinity, model: 'pistol' },
            { id: 2, name: 'M4A1', type: 'hitscan', dmg: 15, rate: 100, range: 150, ammo: 300, model: 'rifle' },
            { id: 3, name: 'RPG', type: 'rocket', dmg: 100, rate: 1500, range: 200, ammo: 10, model: 'rpg' }
        ];

        // --- FIREBASE SETUP ---
        const firebaseConfig = {
            apiKey: "AIzaSyCuozxRg0t1MyzaoMwYDdWK6nyE3Btd--o", // Clé publique de démo
            authDomain: "wikimind-gtw.firebaseapp.com",
            databaseURL: "https://wikimind-gtw-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "wikimind-gtw",
            storageBucket: "wikimind-gtw.firebasestorage.app",
            messagingSenderId: "576444288903",
            appId: "1:576444288903:web:e8568ba12fab086c794d22"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // --- ENGINE VARIABLES ---
        let scene, camera, renderer, controls;
        let clock = new THREE.Clock();
        
        // Game Objects
        const cityGroup = new THREE.Group();
        const projectiles = [];
        const particles = [];
        const colliders = []; // Murs
        const interactables = []; // Véhicules
        const npcs = []; // Humains IA

        // State
        let myId = null;
        let players = {};
        let me = { 
            hp: 100, armor: 0, 
            wanted: 0, weaponIdx: 1, 
            inVehicle: false, vehicleId: null,
            skinColor: '#0088ff'
        };
        
        // Physics
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let canJump = false;
        let lastShootTime = 0;
        
        // Inputs
        const keys = { w:false, a:false, s:false, d:false, space:false, shift:false };

        // --- INITIALIZATION ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // LUMIERES
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(50, 200, 100);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 200;
            dirLight.shadow.camera.bottom = -200;
            dirLight.shadow.camera.left = -200;
            dirLight.shadow.camera.right = 200;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // CONTROLS
            controls = new PointerLockControls(camera, document.body);
            controls.addEventListener('unlock', () => {
                // Pause menu logic here if needed
            });

            // GENERATION DU MONDE
            generateCity();
            generateNPCs();
            generateVehicles();

            // ECOUTEURS
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            
            // MENU BUTTON
            document.getElementById('play-btn').addEventListener('click', startGame);
        }

        function startGame() {
            const name = document.getElementById('player-name').value;
            const color = document.getElementById('skin-color').value;
            CONFIG.showHitboxes = document.getElementById('show-hitboxes').checked;
            me.skinColor = color;
            me.name = name;

            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'block';

            controls.lock();

            // Auth & Spawn
            signInAnonymously(auth).then((cred) => {
                myId = cred.user.uid;
                spawnPlayer();
                startNetwork();
                animate();
            });
        }

        function spawnPlayer() {
            camera.position.set(0, 5, 0); // Spawn point
            updateWeaponModel();
        }

        // --- ASSETS PROCEDURAUX (GRAPHISMES) ---
        function createCarMesh(color) {
            const mesh = new THREE.Group();
            // Chassis
            const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            body.castShadow = true;
            mesh.add(body);
            // Cabine
            const cabGeo = new THREE.BoxGeometry(1.8, 0.6, 2.5);
            const cabMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const cab = new THREE.Mesh(cabGeo, cabMat);
            cab.position.y = 1.5; cab.position.z = -0.5;
            mesh.add(cab);
            // Roues
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            wheelGeo.rotateZ(Math.PI/2);
            
            const wPositions = [[1, 0.4, 1.5], [-1, 0.4, 1.5], [1, 0.4, -1.5], [-1, 0.4, -1.5]];
            wPositions.forEach(pos => {
                const w = new THREE.Mesh(wheelGeo, wheelMat);
                w.position.set(...pos);
                mesh.add(w);
            });
            return mesh;
        }

        function createHumanMesh(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color });
            // Torse
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.3), mat);
            body.position.y = 1.1;
            // Tête
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshStandardMaterial({ color: 0xffccaa }));
            head.position.y = 1.8;
            // Jambes
            const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.8, 0.25), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            leg1.position.set(-0.15, 0.4, 0);
            const leg2 = leg1.clone();
            leg2.position.set(0.15, 0.4, 0);
            
            group.add(body, head, leg1, leg2);
            group.castShadow = true;
            
            if(CONFIG.showHitboxes) {
                const helper = new THREE.BoxHelper(group, 0x00ff00);
                group.add(helper);
            }
            return group;
        }

        function createWeaponMesh(type) {
            const g = new THREE.Group();
            if(type === 'pistol') {
                const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.4), new THREE.MeshStandardMaterial({color:0x555}));
                barrel.position.z = -0.2;
                g.add(barrel);
            } else if(type === 'rifle') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.15, 0.8), new THREE.MeshStandardMaterial({color:0x333}));
                body.position.z = -0.3;
                g.add(body);
            } else if(type === 'rpg') {
                const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1.2), new THREE.MeshStandardMaterial({color:0x556b2f}));
                tube.rotateX(Math.PI/2);
                g.add(tube);
            }
            return g;
        }

        // --- WORLD GENERATION ---
        function generateCity() {
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x446633 });
            
            // Sol
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), grassMat);
            floor.rotation.x = -Math.PI/2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Grille de ville
            const SIZE = 10;
            const TILE = 20; // mètres
            
            for(let x=-SIZE; x<=SIZE; x++) {
                for(let z=-SIZE; z<=SIZE; z++) {
                    const xp = x*TILE;
                    const zp = z*TILE;
                    
                    if (x%2===0 || z%2===0) {
                        // Route
                        const road = new THREE.Mesh(new THREE.PlaneGeometry(TILE, TILE), roadMat);
                        road.rotation.x = -Math.PI/2;
                        road.position.set(xp, 0.02, zp);
                        road.receiveShadow = true;
                        cityGroup.add(road);
                    } else {
                        // Batiment
                        const h = 5 + Math.random() * 15;
                        const w = TILE - 4;
                        const buildGeo = new THREE.BoxGeometry(w, h, w);
                        const texCtx = document.createElement('canvas').getContext('2d');
                        texCtx.canvas.width = 64; texCtx.canvas.height = 64;
                        texCtx.fillStyle = '#555'; texCtx.fillRect(0,0,64,64);
                        texCtx.fillStyle = '#8af'; 
                        if(Math.random()>0.5) texCtx.fillRect(10,10,20,30); // Fenêtre
                        
                        const buildMat = new THREE.MeshStandardMaterial({ 
                            map: new THREE.CanvasTexture(texCtx.canvas),
                            color: Math.random() * 0xffffff
                        });
                        
                        const build = new THREE.Mesh(buildGeo, buildMat);
                        build.position.set(xp, h/2, zp);
                        build.castShadow = true;
                        cityGroup.add(build);
                        
                        // Hitbox mur
                        const box = new THREE.Box3().setFromObject(build);
                        colliders.push(box);
                    }
                }
            }
            scene.add(cityGroup);
        }

        function generateVehicles() {
            for(let i=0; i<15; i++) {
                const v = {
                    id: 'car_'+i,
                    type: 'car',
                    mesh: createCarMesh(Math.random()*0xffffff),
                    speed: 0,
                    dir: 0,
                    x: (Math.random()-0.5)*180,
                    z: (Math.random()-0.5)*180,
                    occupied: false
                };
                v.mesh.position.set(v.x, 0, v.z);
                scene.add(v.mesh);
                interactables.push(v);
            }
        }

        function generateNPCs() {
            // Créer 20 civils
            for(let i=0; i<30; i++) {
                const npc = {
                    id: 'npc_'+i,
                    type: 'civilian',
                    hp: 100,
                    state: 'walk', // walk, flee, dead
                    mesh: createHumanMesh(0xaaaaaa),
                    x: (Math.random()-0.5)*150,
                    z: (Math.random()-0.5)*150,
                    destX: 0, destZ: 0,
                    speed: 2 + Math.random()*2
                };
                npc.mesh.position.set(npc.x, 0, npc.z);
                pickRandomDest(npc);
                scene.add(npc.mesh);
                npcs.push(npc);
            }
        }

        function pickRandomDest(npc) {
            npc.destX = npc.x + (Math.random()-0.5)*40;
            npc.destZ = npc.z + (Math.random()-0.5)*40;
        }

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            
            if (controls.isLocked) {
                // 1. Mouvement Joueur / Véhicule
                if (me.inVehicle) {
                    updateVehiclePhysics(delta);
                } else {
                    updatePlayerPhysics(delta);
                }
                
                // 2. Sync Firebase
                if (myId) {
                    const pos = me.inVehicle ? interactables.find(v=>v.id===me.vehicleId).mesh.position : camera.position;
                    // On envoie moins souvent pour perf ? Non, local est fluide
                    // Ici on update juste la variable locale qui sera envoyée par intervalle
                }
            }

            // 3. Projectiles
            updateProjectiles(delta);
            
            // 4. NPCs (AI Simple)
            updateNPCs(delta);
            
            // 5. Remote Players interpolation
            updateRemotePlayers(delta);

            renderer.render(scene, camera);
        }

        // --- PHYSIQUE JOUEUR (CORRIGÉE) ---
        function updatePlayerPhysics(delta) {
            // Friction
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= CONFIG.gravity * delta; // Gravité

            direction.z = Number(keys.w) - Number(keys.s);
            direction.x = Number(keys.d) - Number(keys.a);
            direction.normalize(); // Important pour diagonales

            if (keys.w || keys.s || keys.a || keys.d) {
                const speed = keys.shift ? CONFIG.runSpeed : CONFIG.walkSpeed;
                
                // Obtenir le vecteur avant de la caméra mais aplati sur Y
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                camDir.y = 0; camDir.normalize();
                
                // Vecteur droit
                const sideDir = new THREE.Vector3();
                sideDir.crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();

                // Combiner
                const moveVec = new THREE.Vector3();
                moveVec.addScaledVector(camDir, direction.z);
                moveVec.addScaledVector(sideDir, direction.x);
                
                velocity.x += moveVec.x * speed * 10 * delta;
                velocity.z += moveVec.z * speed * 10 * delta;
            }

            // Saut
            if (keys.space && canJump) {
                velocity.y = CONFIG.jumpForce;
                canJump = false;
            }

            // Application
            camera.position.x += velocity.x * delta;
            camera.position.z += velocity.z * delta;
            camera.position.y += velocity.y * delta;

            // Sol Collision
            if (camera.position.y < 2) {
                velocity.y = 0;
                camera.position.y = 2;
                canJump = true;
            }

            // Mur Collision (Simple AABB)
            const pBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(1, 2, 1));
            colliders.forEach(wall => {
                if (pBox.intersectsBox(wall)) {
                    // Repousser simplement (très basique)
                    const center = new THREE.Vector3();
                    wall.getCenter(center);
                    const dir = camera.position.clone().sub(center).normalize();
                    camera.position.addScaledVector(dir, 0.1);
                }
            });

            // Interaction Check
            checkForInteraction();
        }

        // --- PHYSIQUE VÉHICULE ---
        function updateVehiclePhysics(delta) {
            const car = interactables.find(v => v.id === me.vehicleId);
            if (!car) return;

            // Accélération / Frein
            if (keys.w) car.speed += 20 * delta;
            if (keys.s) car.speed -= 20 * delta;
            // Friction naturelle
            car.speed *= 0.98;

            // Rotation
            if (Math.abs(car.speed) > 1) {
                const turnSpeed = delta * 2;
                if (keys.a) car.mesh.rotation.y += turnSpeed;
                if (keys.d) car.mesh.rotation.y -= turnSpeed;
            }

            // Mouvement
            const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0,1,0), car.mesh.rotation.y);
            car.mesh.position.addScaledVector(forward, car.speed * delta);

            // Sync Camera avec Voiture
            const camOffset = new THREE.Vector3(0, 5, -10).applyAxisAngle(new THREE.Vector3(0,1,0), car.mesh.rotation.y);
            camera.position.copy(car.mesh.position).add(camOffset);
            camera.lookAt(car.mesh.position);
            
            // UI
            document.getElementById('interaction-txt').style.display = 'block';
            document.getElementById('interaction-txt').innerText = "[F] Sortir";
        }

        // --- COMBAT & AI ---
        function onMouseDown() {
            if (!controls.isLocked) return;
            
            const now = Date.now();
            const wep = WEAPONS[me.weaponIdx];
            if (now - lastShootTime < wep.rate) return;
            lastShootTime = now;

            if (wep.type === 'hitscan') {
                // Raycast
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
                
                // Flash visuel
                createMuzzleFlash();

                // Check collision NPC
                const hitObjects = [];
                npcs.forEach(n => { if(n.state !== 'dead') hitObjects.push(n.mesh); });
                
                const intersects = raycaster.intersectObjects(hitObjects, true);
                if (intersects.length > 0) {
                    // Hit NPC
                    const hitMesh = intersects[0].object;
                    // Remonter au groupe parent pour trouver l'ID
                    const npcGroup = hitMesh.parent; 
                    const target = npcs.find(n => n.mesh === npcGroup);
                    
                    if (target) damageNPC(target, wep.dmg);
                }
                
                // Recul visuel
                camera.rotation.x += 0.02;

            } else if (wep.type === 'rocket') {
                // Créer missile
                const geo = new THREE.SphereGeometry(0.3);
                const mat = new THREE.MeshBasicMaterial({color:0x000000});
                const mesh = new THREE.Mesh(geo, mat);
                
                const dir = new THREE.Vector3();
                camera.getWorldDirection(dir);
                mesh.position.copy(camera.position).addScaledVector(dir, 1);
                
                projectiles.push({
                    mesh: mesh,
                    vel: dir.multiplyScalar(40),
                    type: 'rocket',
                    dmg: 100
                });
                scene.add(mesh);
            }
        }

        function createMuzzleFlash() {
            // Petit éclair devant la caméra
            // (Simplifié pour ce script unique)
        }

        function damageNPC(npc, dmg) {
            npc.hp -= dmg;
            
            // Réaction
            if (npc.hp > 0) {
                npc.state = 'flee';
                // Probabilité d'appeler la police
                if (Math.random() > 0.7 && me.wanted === 0) {
                    triggerWanted(1);
                    showNotification("Un civil appelle la police !");
                }
            } else {
                if (npc.state !== 'dead') {
                    npc.state = 'dead';
                    npc.mesh.rotation.x = -Math.PI/2; // Tombe
                    npc.mesh.position.y = 0.2;
                    me.wanted = Math.max(me.wanted, 1); // Meurtre = étoile
                    updateWantedUI();
                    
                    // Appeler l'ambulance automatiquement après délai
                    setTimeout(() => callMedicFor(npc), 3000);
                }
            }
        }

        function triggerWanted(level) {
            if (me.wanted < level) {
                me.wanted = level;
                updateWantedUI();
                spawnPolice();
            }
        }

        function callMedicFor(deadNpc) {
            // Simuler une ambulance qui spawn et vient chercher le corps
            showNotification("SAMU en route...");
            setTimeout(() => {
                // Le corps disparait
                deadNpc.mesh.visible = false;
                deadNpc.mesh.position.y = -100; // Cacher
                showNotification("Corps évacué.");
            }, 5000);
        }

        function updateNPCs(delta) {
            npcs.forEach(npc => {
                if (npc.state === 'dead') return;
                
                const pos = npc.mesh.position;
                const speed = (npc.state === 'flee' ? 8 : 2) * delta;
                
                // Deplacement vers dest
                const dx = npc.destX - pos.x;
                const dz = npc.destZ - pos.z;
                const dist = Math.sqrt(dx*dx + dz*dz);
                
                if (dist < 1) {
                    pickRandomDest(npc);
                } else {
                    pos.x += (dx/dist) * speed;
                    pos.z += (dz/dist) * speed;
                    npc.mesh.lookAt(npc.destX, npc.mesh.position.y, npc.destZ);
                }
                
                // Si Wanted > 0, les policiers poursuivent le joueur
                if (npc.type === 'police' && me.wanted > 0) {
                    npc.destX = camera.position.x;
                    npc.destZ = camera.position.z;
                    // Shoot logic (simplified)
                    if (dist < 20) {
                        // Pan pan
                        if (Math.random() < 0.05) {
                            me.hp -= 5;
                            updateStatsUI();
                            // Screen flash rouge
                            document.body.style.backgroundColor = 'red';
                            setTimeout(() => document.body.style.backgroundColor = '#111', 50);
                        }
                    }
                }
            });
        }

        function spawnPolice() {
            // Transformer 3 civils en policiers (Lazy approach) ou en spawn
            for(let i=0; i<3; i++) {
                const cop = {
                    id: 'cop_'+Date.now()+i,
                    type: 'police',
                    hp: 100,
                    state: 'flee', // Actually chase
                    mesh: createHumanMesh(0x0000ff), // Bleu
                    x: camera.position.x + (Math.random()-0.5)*50,
                    z: camera.position.z + (Math.random()-0.5)*50,
                    destX: camera.position.x, destZ: camera.position.z,
                    speed: 9
                };
                cop.mesh.position.set(cop.x, 0, cop.z);
                scene.add(cop.mesh);
                npcs.push(cop);
            }
            showNotification("LA POLICE EST LÀ !");
        }

        function updateProjectiles(delta) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.addScaledVector(p.vel, delta);
                
                // Collision sol
                if (p.mesh.position.y < 0) {
                    createExplosion(p.mesh.position);
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        function createExplosion(pos) {
            // Simple visuel
            const geo = new THREE.SphereGeometry(4);
            const mat = new THREE.MeshBasicMaterial({color: 0xffaa00, wireframe:true});
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos);
            scene.add(mesh);
            setTimeout(()=>scene.remove(mesh), 500);
            
            // Dégats de zone
            npcs.forEach(n => {
                if (n.mesh.position.distanceTo(pos) < 10) {
                    damageNPC(n, 100);
                }
            });
        }

        // --- NETWORK SYNC ---
        function startNetwork() {
            // Envoyer ma position
            setInterval(() => {
                if(!myId) return;
                const pos = me.inVehicle && me.vehicleId ? interactables.find(v=>v.id===me.vehicleId).mesh.position : camera.position;
                
                update(ref(db, 'players/' + myId), {
                    x: pos.x, y: pos.y, z: pos.z,
                    color: me.skinColor,
                    inVehicle: me.inVehicle,
                    wep: me.weaponIdx
                });
            }, 50); // 20 ticks/s

            // Recevoir
            onValue(ref(db, 'players'), (snap) => {
                const data = snap.val();
                if(!data) return;
                
                Object.keys(data).forEach(pid => {
                    if(pid === myId) return;
                    const pData = data[pid];
                    
                    if(!players[pid]) {
                        players[pid] = {
                            mesh: createHumanMesh(pData.color || 0xffffff),
                            targetPos: new THREE.Vector3()
                        };
                        scene.add(players[pid].mesh);
                    }
                    
                    // Interpolation target
                    players[pid].targetPos.set(pData.x, pData.y-1, pData.z); // -1 car camera est aux yeux
                    
                    // Si vehicule, on pourrait cacher le mesh ou le mettre dans une voiture
                });
                
                // Cleanup disconnected
                Object.keys(players).forEach(pid => {
                    if(!data[pid]) {
                        scene.remove(players[pid].mesh);
                        delete players[pid];
                    }
                });
            });
            
            // Supprimer si je quitte
            onDisconnect(ref(db, 'players/' + myId)).remove();
        }

        function updateRemotePlayers(delta) {
            Object.values(players).forEach(p => {
                p.mesh.position.lerp(p.targetPos, delta * 10);
            });
        }

        // --- UI & PHONE ---
        window.callService = function(service) {
            if (service === 'police') {
                showNotification("17 : Police en route");
                spawnPolice();
            } else if (service === 'medic') {
                showNotification("15 : Ambulance envoyée");
                // Logique medic
            } else if (service === 'cheat') {
                me.wanted = 0;
                updateWantedUI();
                showNotification("Lester : Indice de recherche effacé.");
                // Retirer policiers
                npcs.forEach(n => {
                    if(n.type==='police') { n.hp = 0; damageNPC(n, 100); } // Ils meurent/partent
                });
            } else if (service === 'car') {
                const v = {
                    id: 'drop_car_'+Date.now(),
                    type: 'car',
                    mesh: createCarMesh(0xffd700),
                    speed: 0,
                    dir: 0,
                    x: camera.position.x + 5,
                    z: camera.position.z + 5,
                    occupied: false
                };
                v.mesh.position.set(v.x, 0, v.z);
                scene.add(v.mesh);
                interactables.push(v);
                showNotification("Voiture livrée devant vous.");
            }
            togglePhone();
        };

        function togglePhone() {
            const el = document.getElementById('phone');
            if (el.classList.contains('open')) el.classList.remove('open');
            else el.classList.add('open');
        }

        function showNotification(text) {
            const div = document.createElement('div');
            div.style.position = 'absolute';
            div.style.left = '20px'; div.style.top = '100px';
            div.style.background = 'rgba(0,0,0,0.7)';
            div.style.color = 'white'; div.style.padding = '10px';
            div.style.borderLeft = '4px solid #facc15';
            div.innerText = text;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function updateWantedUI() {
            const stars = document.querySelectorAll('.star');
            stars.forEach((s, i) => {
                if(i < me.wanted) s.classList.add('active');
                else s.classList.remove('active');
            });
        }

        function updateStatsUI() {
            document.getElementById('hp-bar').style.width = me.hp + '%';
            if(me.hp <= 0) {
                // Mort
                controls.unlock();
                alert("VOUS ÊTES MORT - WASTED");
                location.reload();
            }
        }

        // --- INPUT HANDLING ---
        function onKeyDown(e) {
            switch(e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': keys.space = true; break;
                case 'ShiftLeft': keys.shift = true; break;
                case 'KeyF': handleInteraction(); break;
                case 'KeyP': togglePhone(); break;
                case 'Digit1': switchWep(0); break;
                case 'Digit2': switchWep(1); break;
                case 'Digit3': switchWep(2); break;
                case 'Digit4': switchWep(3); break;
            }
        }
        function onKeyUp(e) {
            switch(e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
                case 'ShiftLeft': keys.shift = false; break;
            }
        }

        function checkForInteraction() {
            let found = null;
            interactables.forEach(v => {
                if (camera.position.distanceTo(v.mesh.position) < 5) found = v;
            });
            const ui = document.getElementById('interaction-txt');
            if (found && !me.inVehicle) {
                ui.style.display = 'block';
                ui.innerText = "[F] Conduire";
            } else {
                ui.style.display = 'none';
            }
        }

        function handleInteraction() {
            if (me.inVehicle) {
                // Exit
                me.inVehicle = false;
                const v = interactables.find(v => v.id === me.vehicleId);
                camera.position.set(v.mesh.position.x + 3, 2, v.mesh.position.z);
                me.vehicleId = null;
                camera.rotation.set(0,0,0);
            } else {
                // Enter
                interactables.forEach(v => {
                    if (camera.position.distanceTo(v.mesh.position) < 5) {
                        me.inVehicle = true;
                        me.vehicleId = v.id;
                    }
                });
            }
        }

        // --- WEAPONS VISUALS ---
        let currentWepMesh = null;
        function updateWeaponModel() {
            if(currentWepMesh) camera.remove(currentWepMesh);
            const wep = WEAPONS[me.weaponIdx];
            currentWepMesh = createWeaponMesh(wep.model);
            currentWepMesh.position.set(0.3, -0.3, -0.5);
            camera.add(currentWepMesh);
            
            document.getElementById('wep-ui').innerText = wep.name;
            document.getElementById('ammo-ui').innerText = wep.ammo === Infinity ? '∞' : wep.ammo;
        }
        function switchWep(idx) {
            me.weaponIdx = idx;
            updateWeaponModel();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        init();

    </script>
</body>
</html>
