<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiMind Face - Spatial Computing</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js (Moteur 3D) -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
      }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --bg-dark: #050505;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            overflow: hidden;
            margin: 0;
        }

        /* UI Overlay */
        #interface-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
        }

        /* Canvas Layers */
        #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); z-index: 1; opacity: 0; }
        #output_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; transform: scaleX(-1); }
        #three_canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; transform: scaleX(-1); }

        /* HUD Elements */
        .hud-panel {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            pointer-events: auto;
        }

        .scan-line {
            position: absolute; width: 100%; height: 4px;
            background: linear-gradient(to right, transparent, var(--neon-blue), transparent);
            animation: scan 3s linear infinite;
            opacity: 0.3; z-index: 4;
        }

        @keyframes scan { 0% { top: 0%; } 100% { top: 100%; } }

        .loading-ring {
            display: inline-block; width: 24px; height: 24px;
            border: 3px solid rgba(255,255,255,0.3); border-radius: 50%;
            border-top-color: var(--neon-blue);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .typewriter::after { content: '|'; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <!-- VIDEO INPUT (Hidden but active) -->
    <video id="webcam" autoplay playsinline></video>

    <!-- LAYERS -->
    <canvas id="output_canvas"></canvas> <!-- Dessin 2D (Points visages/mains) -->
    <canvas id="three_canvas"></canvas>  <!-- Dessin 3D (Cubes) -->
    <div class="scan-line"></div>

    <!-- UI INTERFACE -->
    <div id="interface-layer" class="flex flex-col justify-between p-6">
        
        <!-- HEADER -->
        <div class="flex justify-between items-start">
            <div class="hud-panel p-4 flex items-center gap-4">
                <div class="w-10 h-10 bg-white text-black rounded-lg flex items-center justify-center font-black text-xl">W</div>
                <div>
                    <h1 class="font-black text-lg tracking-tighter uppercase italic">WikiMind Face</h1>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-xs font-mono text-green-500 uppercase">Système en ligne</span>
                    </div>
                </div>
            </div>

            <div class="hud-panel p-4 text-right">
                <div class="text-xs text-gray-400 font-mono uppercase mb-1">FPS Core</div>
                <div id="fps-counter" class="text-xl font-bold font-mono">00</div>
            </div>
        </div>

        <!-- CENTER CROSSHAIR -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 opacity-20 pointer-events-none">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <path d="M40 50h20M50 40v20" stroke="white" stroke-width="1"/>
                <circle cx="50" cy="50" r="40" stroke="white" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
            </svg>
        </div>

        <!-- BOTTOM PANELS -->
        <div class="flex flex-col md:flex-row gap-4 items-end">
            
            <!-- MISTRAL AI CHAT -->
            <div class="hud-panel w-full md:w-96 p-4 flex flex-col gap-2">
                <div class="flex items-center justify-between border-b border-gray-800 pb-2 mb-2">
                    <span class="text-xs font-bold uppercase text-blue-400">Mistral AI Cortex</span>
                    <div id="ai-loading" class="hidden"><div class="loading-ring w-4 h-4 border-2"></div></div>
                </div>
                <div id="ai-output" class="text-sm font-mono text-gray-300 min-h-[60px] leading-relaxed typewriter">
                    Initialisation des modules neuronaux...
                </div>
            </div>

            <!-- STATUS DATA -->
            <div class="hud-panel p-4 min-w-[200px]">
                <div class="space-y-3">
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Emotion Détectée</div>
                        <div id="emotion-display" class="text-lg font-bold text-white">Analyse...</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Main Geste</div>
                        <div id="gesture-display" class="text-sm font-mono text-blue-300">Aucun</div>
                    </div>
                    <div>
                        <div class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Objets 3D</div>
                        <div id="objects-count" class="text-sm font-mono text-purple-300">0 actif(s)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loader" class="fixed inset-0 bg-black z-50 flex flex-col items-center justify-center">
        <div class="text-4xl font-black mb-4 tracking-tighter animate-pulse">WIKIMIND FACE</div>
        <div class="flex items-center gap-3 text-sm font-mono text-gray-400">
            <div class="loading-ring"></div>
            Chargement des modèles Vision (15Mo)...
        </div>
    </div>

    <!-- LOGIC -->
    <script type="module">
        import * as THREE from 'three';
        import { FilesetResolver, FaceLandmarker, HandLandmarker } from '@mediapipe/tasks-vision';

        const MISTRAL_API_KEY = "2Dc4NHEdCUbHNTacaXNFzm8AwP6UEote"; // Note: En prod, ne jamais exposer la clé côté client.
        
        // DOM Elements
        const video = document.getElementById('webcam');
        const canvas2D = document.getElementById('output_canvas');
        const canvas3D = document.getElementById('three_canvas');
        const ctx = canvas2D.getContext('2d');
        const emotionDisplay = document.getElementById('emotion-display');
        const gestureDisplay = document.getElementById('gesture-display');
        const aiOutput = document.getElementById('ai-output');
        const loader = document.getElementById('loader');
        
        let faceLandmarker, handLandmarker;
        let lastVideoTime = -1;
        let resultsFace = undefined;
        let resultsHand = undefined;
        
        // 3D Variables
        let scene, camera, renderer, cube;
        let cubes = []; // Store multiple objects
        let isPinching = false;
        let pinchDistance = 0;

        // AI Variables
        let lastEmotion = "Neutral";
        let lastMistralCall = 0;
        
        // SETUP THREE.JS
        function initThree() {
            scene = new THREE.Scene();
            // Caméra orthographique pour s'aligner parfaitement avec la vidéo 2D
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ canvas: canvas3D, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // Lumières
            const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 3);
            directionalLight.position.set(1, 1, 2);
            scene.add(directionalLight);

            // Cube de base (curseur)
            const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x00f3ff, 
                wireframe: true,
                emissive: 0x00f3ff,
                emissiveIntensity: 0.5
            });
            cube = new THREE.Mesh(geometry, material);
            cube.visible = false;
            scene.add(cube);
        }

        // SETUP MEDIAPIPE
        async function createVisionTasks() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );

            // Face Mesh (478 points + Blendshapes pour émotions)
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                    delegate: "GPU"
                },
                outputFaceBlendshapes: true,
                runningMode: "VIDEO",
                numFaces: 1
            });

            // Hand Tracking
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });

            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 500);
            startCamera();
        }

        // CAMERA
        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } }).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", predictWebcam);
            });
        }

        // MISTRAL API CALL
        async function talkToMistral(emotion, action) {
            const now = Date.now();
            if (now - lastMistralCall < 6000) return; // Limite 1 appel toutes les 6s
            lastMistralCall = now;

            document.getElementById('ai-loading').classList.remove('hidden');

            const prompt = `Tu es WikiMind, une IA futuriste intégrée dans l'interface visuelle de l'utilisateur. 
            Analyse : L'utilisateur semble ressentir : "${emotion}". Action récente : "${action}".
            Réponds en une phrase courte, style sci-fi, un peu clinique mais serviable.`;

            try {
                const response = await fetch("https://api.mistral.ai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${MISTRAL_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "mistral-tiny",
                        messages: [{ role: "user", content: prompt }],
                        max_tokens: 60
                    })
                });
                
                const data = await response.json();
                if(data.choices && data.choices[0]) {
                    const text = data.choices[0].message.content;
                    animateText(text);
                }
            } catch (err) {
                console.error("Mistral Error:", err);
            } finally {
                document.getElementById('ai-loading').classList.add('hidden');
            }
        }

        function animateText(text) {
            aiOutput.innerText = "";
            let i = 0;
            const speed = 30;
            function type() {
                if (i < text.length) {
                    aiOutput.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // MAIN LOOP
        async function predictWebcam() {
            canvas2D.width = video.videoWidth;
            canvas2D.height = video.videoHeight;
            let startTimeMs = performance.now();

            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                
                // Detect Face & Hands
                if (faceLandmarker) resultsFace = faceLandmarker.detectForVideo(video, startTimeMs);
                if (handLandmarker) resultsHand = handLandmarker.detectForVideo(video, startTimeMs);
            }

            ctx.clearRect(0, 0, canvas2D.width, canvas2D.height);

            // 1. ANALYSE EMOTION (FACE)
            if (resultsFace && resultsFace.faceBlendshapes && resultsFace.faceBlendshapes.length > 0) {
                const shapes = resultsFace.faceBlendshapes[0].categories;
                // Simple logic for emotion map
                const smile = shapes.find(s => s.categoryName === 'mouthSmileLeft').score + shapes.find(s => s.categoryName === 'mouthSmileRight').score;
                const browDown = shapes.find(s => s.categoryName === 'browDownLeft').score;
                const eyeWide = shapes.find(s => s.categoryName === 'eyeWideLeft').score;
                
                let currentEmotion = "Neutre";
                if (smile > 0.8) currentEmotion = "Heureux 😊";
                else if (browDown > 0.6) currentEmotion = "Concentré 😠";
                else if (eyeWide > 0.4) currentEmotion = "Surpris 😲";

                emotionDisplay.innerText = currentEmotion;
                
                // Dessiner le maillage visage (futuriste)
                drawFaceMesh(resultsFace.faceLandmarks[0]);

                if (currentEmotion !== lastEmotion) {
                    talkToMistral(currentEmotion, "Changement d'expression faciale détecté");
                    lastEmotion = currentEmotion;
                }
            }

            // 2. ANALYSE GESTES (MAINS) & 3D INTERACTION
            if (resultsHand && resultsHand.landmarks) {
                let gestureTxt = "Tracking...";
                
                for (const landmarks of resultsHand.landmarks) {
                    drawHandSkeleton(landmarks);
                    
                    // Logic: Index Tip (8) & Thumb Tip (4)
                    const indexTip = landmarks[8];
                    const thumbTip = landmarks[4];
                    
                    // Calcul distance pour le "Pinch" (Pincement)
                    const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
                    
                    // Convertir coordonnées 2D (0-1) vers 3D Three.js
                    // x: -1 to 1, y: 1 to -1
                    const x3D = (indexTip.x - 0.5) * -10; // Inversion X car mirroir
                    const y3D = (indexTip.y - 0.5) * -6;
                    
                    cube.position.set(x3D, y3D, 0);

                    // Si Pincement détecté (< 0.05)
                    if (dist < 0.06) {
                        gestureTxt = "🤌 CRÉATION";
                        cube.visible = true;
                        cube.rotation.x += 0.05;
                        cube.rotation.y += 0.05;
                        
                        // Si pincement maintenu, on pourrait "spawner" un objet persistant
                        if (!isPinching) {
                            spawnPersistentCube(x3D, y3D);
                            isPinching = true;
                            talkToMistral(lastEmotion, "L'utilisateur crée de la matière virtuelle.");
                        }
                    } else {
                        isPinching = false;
                        cube.visible = false;
                    }
                }

                // GESTION 2 MAINS : SCALE
                if (resultsHand.landmarks.length === 2) {
                    gestureTxt = "👐 DOUBLE MAIN";
                    const hand1 = resultsHand.landmarks[0][9]; // Middle finger knuckle
                    const hand2 = resultsHand.landmarks[1][9];
                    const handDist = Math.hypot(hand1.x - hand2.x, hand1.y - hand2.y);
                    
                    // Scale global des cubes en fonction de la distance des mains
                    const scale = Math.max(0.2, handDist * 3);
                    cubes.forEach(c => {
                        c.scale.set(scale, scale, scale);
                    });
                    gestureTxt += ` (Scale: ${scale.toFixed(1)}x)`;
                }

                gestureDisplay.innerText = gestureTxt;
            }

            // Rendu 3D
            renderer.render(scene, camera);
            
            // Animation des cubes persistants
            cubes.forEach((c, idx) => {
                c.rotation.x += 0.01;
                c.rotation.y += 0.02;
                // Faire flotter légèrement
                c.position.y += Math.sin(Date.now() / 500 + idx) * 0.005;
            });
            document.getElementById('objects-count').innerText = `${cubes.length} objet(s)`;

            // FPS Counter
            document.getElementById('fps-counter').innerText = Math.round(1000 / (performance.now() - startTimeMs));

            window.requestAnimationFrame(predictWebcam);
        }

        function spawnPersistentCube(x, y) {
            const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            // Matériau aléatoire néon
            const colors = [0x00f3ff, 0xbc13fe, 0x00ff00, 0xff0055];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            const material = new THREE.MeshPhongMaterial({ 
                color: color,
                specular: 0x555555,
                shininess: 30,
                transparent: true, 
                opacity: 0.8 
            });
            const newCube = new THREE.Mesh(geometry, material);
            newCube.position.set(x, y, 0);
            scene.add(newCube);
            cubes.push(newCube);
            
            // Limiter à 10 cubes pour perf
            if(cubes.length > 10) {
                const old = cubes.shift();
                scene.remove(old);
            }
        }

        // DESSIN CANVAS 2D
        function drawFaceMesh(landmarks) {
            ctx.fillStyle = "#00f3ff";
            ctx.lineWidth = 1;
            // On dessine juste quelques points clés pour l'effet "Cyber"
            const indices = [1, 33, 263, 61, 291, 199]; // Nez, yeux, bouche
            indices.forEach(i => {
                const p = landmarks[i];
                ctx.beginPath();
                ctx.arc(p.x * canvas2D.width, p.y * canvas2D.height, 2, 0, 2 * Math.PI);
                ctx.fill();
            });
            
            // Lignes de connexion (Tessellation partielle)
            ctx.strokeStyle = "rgba(0, 243, 255, 0.2)";
            ctx.beginPath();
            ctx.moveTo(landmarks[10].x * canvas2D.width, landmarks[10].y * canvas2D.height); // Haut
            ctx.lineTo(landmarks[152].x * canvas2D.width, landmarks[152].y * canvas2D.height); // Bas
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(landmarks[234].x * canvas2D.width, landmarks[234].y * canvas2D.height); // Oreille G
            ctx.lineTo(landmarks[454].x * canvas2D.width, landmarks[454].y * canvas2D.height); // Oreille D
            ctx.stroke();
        }

        function drawHandSkeleton(landmarks) {
            ctx.fillStyle = "#bc13fe";
            ctx.strokeStyle = "rgba(188, 19, 254, 0.5)";
            ctx.lineWidth = 2;

            const connections = [[0,1], [1,2], [2,3], [3,4], [0,5], [5,6], [6,7], [7,8], [5,9], [9,10], [10,11], [11,12], [9,13], [13,14], [14,15], [15,16], [13,17], [17,18], [18,19], [19,20], [0,17]];

            for (const conn of connections) {
                const p1 = landmarks[conn[0]];
                const p2 = landmarks[conn[1]];
                ctx.beginPath();
                ctx.moveTo(p1.x * canvas2D.width, p1.y * canvas2D.height);
                ctx.lineTo(p2.x * canvas2D.width, p2.y * canvas2D.height);
                ctx.stroke();
            }

            for (const p of landmarks) {
                ctx.beginPath();
                ctx.arc(p.x * canvas2D.width, p.y * canvas2D.height, 3, 0, 2 * Math.PI);
                ctx.fill();
            }
        }

        // Init
        initThree();
        createVisionTasks();

        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
